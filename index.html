<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心跳</title>
<style>
  :root{
    --bg: #05000a;
    --red: #ff1a3c;
    --red-soft: #ff4d6d;
    --red-dim: #7a0e1e;
    --glow: 0 0 6px #ff1a3c, 0 0 16px #ff1a3c, 0 0 32px #b8102b, 0 0 60px #7a0e1e;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    width:100%;
    background: var(--bg);
    overflow:hidden;
    touch-action: manipulation;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* 背景氛围光晕，随心跳呼吸 */
  .ambient{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(255,26,60,0.18), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 50%, rgba(120,10,25,0.25), transparent 75%);
    animation: breathe 1.15s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes breathe{
    0%   { opacity:.55; }
    14%  { opacity:1; }
    28%  { opacity:.5; }
    100% { opacity:.55; }
  }

  .stage{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio: 16/10;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 中央跳动的心脏图形 */
  .heart-wrap{
    position:absolute;
    width:34vmin;
    max-width:260px;
    aspect-ratio:1/1;
    filter: drop-shadow(0 0 10px rgba(255,26,60,.65)) drop-shadow(0 0 30px rgba(255,26,60,.35));
    animation: beat 1.15s ease-in-out infinite;
    opacity:.9;
  }

  .heart-wrap svg path{
    fill: url(#heartGrad);
  }

  @keyframes beat{
    0%   { transform: scale(0.86); }
    14%  { transform: scale(1.06); }
    22%  { transform: scale(0.94); }
    30%  { transform: scale(1.14); }
    45%  { transform: scale(0.9); }
    100% { transform: scale(0.86); }
  }

  /* 心电图折线，横贯全屏、无限循环滚动 */
  .ecg{
    position:relative;
    width:100%;
    height:38%;
    overflow:hidden;
  }

  .ecg svg{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    width:200%;
    animation: scroll 3.6s linear infinite;
  }

  @keyframes scroll{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .ecg-line{
    fill:none;
    stroke: var(--red);
    stroke-width:3.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter: drop-shadow(0 0 3px #ff1a3c) drop-shadow(0 0 10px #ff1a3c) drop-shadow(0 0 22px #b8102b);
  }

  /* 跟随亮点，模拟脉冲头 */
  .pulse-dot{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background: #fff;
    box-shadow: 0 0 8px 3px #fff, 0 0 20px 8px #ff1a3c;
    top:50%;
    animation: dotmove 3.6s linear infinite, dotpulse 0.6s ease-in-out infinite;
  }

  @keyframes dotmove{
    from{ left:0%; }
    to  { left:100%; }
  }

  @keyframes dotpulse{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    50%{ transform: translate(-50%,-50%) scale(1.5); }
  }

  .label{
    position:absolute;
    bottom:6vh;
    left:50%;
    transform:translateX(-50%);
    color: var(--red-soft);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    opacity:.55;
    text-shadow: 0 0 8px rgba(255,26,60,.8);
    animation: breathe 1.15s ease-in-out infinite;
  }

  @media (max-width: 480px){
    .heart-wrap{ width:40vmin; }
    .label{ font-size: 11px; letter-spacing: 3px; bottom: 5vh; }
  }
</style>
</head>
<body>

  <div class="ambient"></div>

  <div class="stage">

    <div class="ecg">
      <svg viewBox="0 0 1600 200" preserveAspectRatio="none">
        <!-- 一个完整周期(0-800)重复一次(800-1600)以实现无缝循环 -->
        <polyline class="ecg-line" points="
          0,100
          140,100
          170,100
          190,60
          210,140
          230,20
          250,175
          270,100
          400,100
          540,100
          570,100
          590,60
          610,140
          630,20
          650,175
          670,100
          800,100
          940,100
          970,100
          990,60
          1010,140
          1030,20
          1050,175
          1070,100
          1200,100
          1340,100
          1370,100
          1390,60
          1410,140
          1430,20
          1450,175
          1470,100
          1600,100
        "/>
      </svg>
      <div class="pulse-dot"></div>
    </div>

    <div class="heart-wrap">
      <svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff5c7a"/>
            <stop offset="55%" stop-color="#ff1a3c"/>
            <stop offset="100%" stop-color="#8c0f22"/>
          </linearGradient>
        </defs>
        <path d="M23.6,0c-3,0-5.7,1.4-7.6,3.7C14.1,1.4,11.4,0,8.4,0C3.8,0,0,3.8,0,8.4
                 c0,9.4,10.6,15.4,15.2,19.4c0.5,0.4,1.1,0.4,1.6,0C21.4,23.8,32,17.8,32,8.4
                 C32,3.8,28.2,0,23.6,0z"/>
      </svg>
    </div>

    <div class="label">noelia</div>

  </div>

</body>
</html>
